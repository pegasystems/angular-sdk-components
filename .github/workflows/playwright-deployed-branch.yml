name: Playwright against deployed branch

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Base URL of the deployed app; tests append /portal and /embedded'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # The portal tests create and hand off one case, so runs against the same deployment must not overlap.
  group: deployed-playwright-${{ inputs.server_url }}
  cancel-in-progress: false

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SERVER_URL: ${{ inputs.server_url }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Validate server URL
        run: |
          node <<'NODE'
          const url = new URL(process.env.PLAYWRIGHT_SERVER_URL);

          if (
            !['http:', 'https:'].includes(url.protocol) ||
            url.username ||
            url.password ||
            url.search ||
            url.hash
          ) {
            throw new Error('Provide a valid HTTP(S) base URL without credentials, query, or fragment');
          }
          NODE

      - name: Check deployed app availability
        run: >-
          curl --fail --silent --show-error --max-time 30 --retry 5
          --retry-delay 5 --retry-all-errors --output /dev/null
          "${PLAYWRIGHT_SERVER_URL%/}/portal"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run MediaCo portal and embedded tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright-report/
          if-no-files-found: ignore
          retention-days: 1

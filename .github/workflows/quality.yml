name: quality

on:
  workflow_dispatch:
  pull_request:
    branches: [master, 'release/**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint and format
        run: npm run lint
      - name: Build library
        run: npm run build-angular-sdk-components
      - name: Public API report is up to date
        run: npx api-extractor run
      - name: CHANGELOG.md follows the project format
        run: node scripts/changelog.js check
      - name: Agent assets are consistent
        run: node scripts/check-agent-assets.js
      - name: Tooling script tests
        run: node --test "scripts/__tests__/*.test.js"
      - name: Component catalogue is up to date
        run: node scripts/generate-component-catalog.js --check
      - name: noImplicitAny ratchet
        run: node scripts/check-implicit-any.js
      - name: Build overrides package
        run: npm run build-overrides
      - name: Overrides package type-checks against the built library
        run: npx ngc -p tsconfig.overrides-check.json
      - name: Verify package tarballs
        run: node scripts/smoke-pack.js

  unit-tests:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx ng test angular-sdk-components --watch=false --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/angular-sdk-components
          retention-days: 7

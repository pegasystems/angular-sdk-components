name: quality

on:
  workflow_dispatch:
  pull_request:
    branches: [master, 'release/**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint and format
        run: npm run lint
      - name: Build library
        run: npm run build-angular-sdk-components
      - name: Public API report is up to date
        run: npm run api:check
      - name: Tooling script tests
        run: npm run test:scripts
      - name: Component catalogue is up to date
        run: npm run docs:components:check
      - name: noImplicitAny ratchet
        run: npm run check:any
      - name: Build overrides package
        run: npm run build-overrides
      - name: Overrides package type-checks against the built library
        run: npm run check:overrides
      - name: Verify package tarballs
        run: npm run smoke:pack

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:unit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sdk-ci .
      - name: Smoke test (config is rendered from SDK_* variables at start)
        run: |
          docker run -d --name sdk -p 8080:8080 \
            -e SDK_INFINITY_REST_SERVER_URL=https://pega.example.com/prweb \
            -e SDK_APP_ALIAS=SmokeApp sdk-ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/sdk-config.json | grep -q '"appAlias": "SmokeApp"'
          curl -fsS -o /dev/null http://localhost:8080/portal
          curl -fsS -o /dev/null http://localhost:8080/embedded
      - name: Container logs
        if: failure()
        run: docker logs sdk

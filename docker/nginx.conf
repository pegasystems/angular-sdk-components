server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip_static on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Runtime configuration and entry pages must never be cached, otherwise config changes are not picked up.
  location = /sdk-config.json {
    add_header Cache-Control "no-store";
  }

  # Fingerprinted bundles are safe to cache for a long time.
  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # portal.html, embedded.html, fullportal.html, simpleportal.html and mashup.html are generated by the build.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html /index.html;
  }
}

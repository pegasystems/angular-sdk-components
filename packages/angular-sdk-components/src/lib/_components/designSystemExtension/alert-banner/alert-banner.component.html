<div>
  @for (banner of banners; track banner) {
    <div>
      @for (message of banner.messages; track message) {
        <div>
          <component-mapper
            name="Alert"
            [props]="{ message, severity: SEVERITY_MAP[banner.variant], hideClose: banner.variant === 'urgent' }"
            [parent]="this"
            [outputEvents]="{ onClose: onAlertClose }"
          ></component-mapper>
        </div>
      }
    </div>
  }
</div>

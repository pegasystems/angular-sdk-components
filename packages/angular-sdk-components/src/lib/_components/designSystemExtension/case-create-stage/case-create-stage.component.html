@for (kid of arChildren$; track kid) {
  <div>
    @if (kid.getPConnect().getConfigProps().template != '') {
      <div>
        <component-mapper
          [name]="kid.getPConnect().getConfigProps().template"
          [props]="{
            pConn$: kid.getPConnect(),
            formGroup$: formGroup$
          }"
          errorMsg="CreateCaseStage Missing: {{ kid.getPConnect().getConfigProps().template }}"
        ></component-mapper>
      </div>
    }
  </div>
}

<div class="field-group-container">
  @if (name) {
    <div class="field-group-heading">
      @if (collapsible) {
        <span id="field-group-header" class="field-group-header" (click)="headerClickHandler()">
          @if (collapsed) {
            <mat-icon aria-hidden="false" aria-label="Arrow Right" fontIcon="keyboard_arrow_right"></mat-icon>
          } @else {
            <mat-icon aria-hidden="false" aria-label="Arrow Down" fontIcon="keyboard_arrow_down"></mat-icon>
          }
          <b>{{ name }}</b>
        </span>
      } @else {
        <span>{{ name }}</span>
      }
    </div>
  }

  @if (instructions && instructions !== 'none') {
    <div class="field-group-instructions">
      <div key="instructions" id="instruction-text" [innerHTML]="instructions"></div>
    </div>
  }
  @if (!collapsed) {
    <div class="field-group-content">
      <ng-container [ngTemplateOutlet]="childrenTemplate"></ng-container>
    </div>
  }
</div>

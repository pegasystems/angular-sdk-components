<div>
  <mat-button-toggle-group vertical hideSingleSelectionIndicator (change)="onChange($event.value)" [value]="selectedTabId$" aria-label="Tabs">
    @for (tab of tabConfig$; track tab) {
      <mat-button-toggle [value]="tab.id" style="text-align: left">
        <div style="display: flex">
          <div style="flex-grow: 10">{{ tab.name }}</div>
          <div style="flex-grow: 1">
            @if (tab?.count) {
              <span [matBadge]="tab.count" matBadgeOverlap="false" matBadgePosition="after" class="psdk-vtab-badge">&nbsp;</span>
            }
          </div>
        </div>
      </mat-button-toggle>
    }
  </mat-button-toggle-group>
</div>

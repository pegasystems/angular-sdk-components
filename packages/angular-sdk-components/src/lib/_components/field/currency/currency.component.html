@if (displayMode$) {
  <div>
    @if (bVisible$ !== false) {
      <component-mapper name="FieldValueList" [props]="{ label$, value$: formattedValue, displayMode$ }"></component-mapper>
    }
  </div>
} @else {
  @if (bHasForm$) {
    <div>
      @if (bVisible$) {
        <div [formGroup]="formGroup$" class="psdk-currency-field">
          <mat-form-field class="psdk-full-width" subscriptSizing="dynamic">
            <mat-label>{{ label$ }}</mat-label>
            <div class="psdk-currency-input">
              <input
                style="margin-left: 5px; margin-top: -1rem"
                type="text"
                matInput
                currencyMask
                [options]="{
                  prefix: currencySymbol,
                  thousands: thousandSeparator,
                  decimal: decimalSeparator,
                  align: 'left',
                  nullable: true,
                  precision: decimalPrecision,
                  inputMode: inputMode
                }"
                [placeholder]="placeholder"
                [formControlName]="controlName$"
                [required]="bRequired$"
                [formControl]="fieldControl"
                [attr.data-test-id]="testId"
                (blur)="fieldOnBlur($event)"
                [readonly]="bReadonly$"
              />
            </div>
            @if (helperText) {
              <mat-hint [appFieldWarning]="bFieldMessageVisible$">{{ helperText }}</mat-hint>
            }
            @if (fieldControl.invalid) {
              <mat-error>{{ getErrorMessage() }}</mat-error>
            }
          </mat-form-field>
        </div>
      }
    </div>
  } @else {
    @if (bVisible$ !== false) {
      <component-mapper name="Text" [props]="{ pConn$, formatAs$: 'text' }"></component-mapper>
    }
  }
}

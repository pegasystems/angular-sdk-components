@if (displayMode$) {
  <div>
    @if (bVisible$ !== false) {
      <component-mapper name="FieldValueList" [props]="{ label$, value$: formattedValue$, displayMode$ }"></component-mapper>
    }
  </div>
} @else {
  @if (!bReadonly$ && bHasForm$) {
    <div>
      @if (bVisible$) {
        <div [formGroup]="formGroup$">
          <mat-form-field class="psdk-full-width" subscriptSizing="dynamic">
            <mat-label>{{ label$ }}</mat-label>
            <input
              matInput
              [owlDateTime]="dtPicker"
              [attr.data-test-id]="testId"
              [placeholder]="placeholder"
              [formControl]="fieldControl"
              (dateTimeChange)="fieldOnDateChange($event)"
              [required]="bRequired$"
              [readonly]="bDisabled$"
            />
            <mat-datepicker-toggle matSuffix [owlDateTimeTrigger]="dtPicker"></mat-datepicker-toggle>
            <owl-date-time #dtPicker [disabled]="bDisabled$" [scrollStrategy]="scrollStrategy"></owl-date-time>
            @if (helperText) {
              <mat-hint [appFieldWarning]="bFieldMessageVisible$">{{ helperText }}</mat-hint>
            }
            @if (fieldControl.invalid) {
              <mat-error>{{ getErrorMessage() }}</mat-error>
            }
          </mat-form-field>
        </div>
      }
    </div>
  } @else {
    @if (bVisible$ !== false) {
      <component-mapper name="Text" [props]="{ pConn$, formatAs$: 'date-time' }"></component-mapper>
    }
  }
}

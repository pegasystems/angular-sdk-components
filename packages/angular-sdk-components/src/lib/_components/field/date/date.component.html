@if (displayMode$) {
  <div>
    @if (bVisible$ !== false) {
      <component-mapper name="FieldValueList" [props]="{ label$, value$: formattedValue$, displayMode$ }"></component-mapper>
    }
  </div>
} @else {
  @if (!bReadonly$ && bHasForm$) {
    <div>
      @if (bVisible$) {
        <div [formGroup]="formGroup$">
          <mat-form-field class="psdk-full-width" subscriptSizing="dynamic">
            <mat-label>{{ label$ }}</mat-label>
            <input
              matInput
              #dateInput
              [attr.data-test-id]="testId"
              [matDatepicker]="pegadate"
              [placeholder]="theDateFormat.dateFormatStringLC"
              type="text"
              [value]="value$"
              [required]="bRequired$"
              [disabled]="bDisabled$"
              [formControl]="fieldControl"
              (dateChange)="fieldOnDateChange($event)"
            />
            <mat-datepicker-toggle matSuffix [for]="pegadate" [disabled]="bDisabled$"></mat-datepicker-toggle>
            <mat-datepicker #pegadate [startAt]="value$" xPosition="end"></mat-datepicker>
            @if (helperText) {
              <mat-hint [appFieldWarning]="bFieldMessageVisible$">{{ helperText }}</mat-hint>
            }
            @if (fieldControl.invalid) {
              <mat-error>{{ getErrorMessage() }}</mat-error>
            }
          </mat-form-field>
        </div>
      }
    </div>
  } @else {
    @if (bVisible$ !== false) {
      <component-mapper name="Text" [props]="{ pConn$, formatAs$: 'date' }"></component-mapper>
    }
  }
}

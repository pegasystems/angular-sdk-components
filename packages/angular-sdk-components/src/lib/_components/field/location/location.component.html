@if (mapReady && bVisible$) {
  <div>
    <!-- Google suggestions -->
    <mat-form-field class="psdk-full-width">
      <mat-label>{{ label$ }}</mat-label>
      <input
        matInput
        type="text"
        [placeholder]="placeholder"
        [formControl]="fieldControl"
        [required]="bRequired$"
        [matAutocomplete]="auto"
        [readonly]="bReadonly$"
        [attr.data-test-id]="testId"
        (blur)="fieldOnBlur()"
      />
      @if (fieldControl.invalid) {
        <mat-error>{{ getErrorMessage() }}</mat-error>
      }
      @if (helperText) {
        <mat-hint [appFieldWarning]="bFieldMessageVisible$">{{ helperText }}</mat-hint>
      }
      <button
        mat-icon-button
        matSuffix
        type="button"
        (click)="locateMe()"
        [disabled]="isLocating || bDisabled$ || bReadonly$"
        aria-label="Use my location"
      >
        @if (!isLocating) {
          <mat-icon>location_on</mat-icon>
        } @else {
          <mat-progress-spinner diameter="24" mode="indeterminate" strokeWidth="3"></mat-progress-spinner>
        }
      </button>
      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onOptionSelected($event)">
        @for (option of filteredOptions; track option) {
          <mat-option [value]="option">
            {{ option }}
          </mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>
    <!-- Google map -->
    @if (showMap) {
      <div class="map-wrapper">
        <google-map height="400px" width="100%" [center]="center" [zoom]="13" (mapClick)="onMapClick($event)">
          @if (markerPosition) {
            <map-marker [position]="markerPosition" [title]="'Selected Location'"></map-marker>
          }
        </google-map>
        @if (bDisabled$ || bReadonly$) {
          <div class="map-blocker"></div>
        }
      </div>
    }
  </div>
}

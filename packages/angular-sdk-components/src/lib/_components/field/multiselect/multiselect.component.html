<div [formGroup]="formGroup$">
  <mat-form-field class="psdk-full-width" subscriptSizing="dynamic">
    <mat-label>{{ label$ }}</mat-label>
    <mat-chip-grid #chipGrid [required]="bRequired$">
      @for (select of selectedItems; track select) {
        <mat-chip-row (removed)="removeChip(select)">
          {{ select.primary }}
          <button matChipRemove>
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip-row>
      }
    </mat-chip-grid>
    <input
      matInput
      [placeholder]="placeholder"
      [formControl]="fieldControl"
      [value]="value$"
      [required]="bRequired$"
      [matAutocomplete]="auto"
      (input)="fieldOnChange($event)"
      [matChipInputFor]="chipGrid"
    />
    <mat-autocomplete #auto="matAutocomplete">
      @for (item of itemsTree; track item) {
        <mat-option [value]="item.primary" (click)="optionClicked($event, item)">
          <mat-checkbox [checked]="item.selected" (click)="optionClicked($event, item)">
            <span>{{ item.primary }}</span>
          </mat-checkbox>
        </mat-option>
      }
    </mat-autocomplete>
    @if (fieldControl.invalid) {
      <mat-error>{{ getErrorMessage() }}</mat-error>
    }
  </mat-form-field>
</div>

@if (displayMode$) {
  <div>
    @if (bVisible$ !== false) {
      <component-mapper name="FieldValueList" [props]="{ label$, value$, displayMode$ }"></component-mapper>
    }
  </div>
} @else {
  @if (bHasForm$ && bVisible$) {
    <div>
      <mat-form-field class="psdk-full-width" subscriptSizing="dynamic" floatLabel="always">
        <mat-tel-input
          [attr.data-test-id]="testId"
          [formControl]="fieldControl"
          [preferredCountries]="preferredCountries"
          [enablePlaceholder]="true"
          [enableSearch]="true"
          [placeholder]="placeholder"
          [required]="bRequired$"
          [disabled]="bDisabled$ || bReadonly$"
          (change)="fieldOnChange()"
          (blur)="fieldOnBlur()"
        >
        </mat-tel-input>
        <mat-label>{{ label$ }}</mat-label>
        @if (helperText) {
          <mat-hint [appFieldWarning]="bFieldMessageVisible$">{{ helperText }}</mat-hint>
        }
        @if (fieldControl.invalid) {
          <mat-error>{{ getErrorMessage() }}</mat-error>
        }
      </mat-form-field>
    </div>
  } @else {
    @if (bVisible$ !== false) {
      <component-mapper name="Text" [props]="{ pConn$, formatAs$: 'text' }"></component-mapper>
    }
  }
}

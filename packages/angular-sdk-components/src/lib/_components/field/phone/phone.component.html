<div *ngIf="displayMode$; else noDisplayMode">
  <component-mapper *ngIf="bVisible$ !== false" name="FieldValueList" [props]="{ label$, value$, displayMode$ }"></component-mapper>
</div>
<ng-template #noDisplayMode>
  <div *ngIf="bHasForm$ && bVisible$; else noEdit">
    <mat-form-field class="psdk-full-width" subscriptSizing="dynamic" floatLabel="always">
      <mat-tel-input
        [attr.data-test-id]="testId"
        [formControl]="fieldControl"
        [preferredCountries]="preferredCountries"
        [enablePlaceholder]="true"
        [enableSearch]="true"
        [placeholder]="placeholder"
        [required]="bRequired$"
        [disabled]="bDisabled$ || bReadonly$"
        (change)="fieldOnChange()"
        (blur)="fieldOnBlur()"
      >
      </mat-tel-input>
      <mat-label>{{ label$ }}</mat-label>
      <mat-hint *ngIf="helperText" [appFieldWarning]="bFieldMessageVisible$">{{ helperText }}</mat-hint>
      <mat-error *ngIf="fieldControl.invalid">{{ getErrorMessage() }}</mat-error>
    </mat-form-field>
  </div>
</ng-template>
<ng-template #noEdit>
  <component-mapper *ngIf="bVisible$ !== false" name="Text" [props]="{ pConn$, formatAs$: 'text' }"></component-mapper>
</ng-template>

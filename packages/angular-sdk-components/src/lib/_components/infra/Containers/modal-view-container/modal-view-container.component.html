@for (modal of modalStack; track trackByModalKey($index, modal)) {
  <div id="dialog" class="psdk-dialog-background">
    <div class="psdk-modal-view-container-top" id="{{ modal.key }}">
      @if (modal.title != '') {
        <h3>{{ modal.title }}</h3>
      }
      <component-mapper
        name="Assignment"
        [props]="{
          pConn$: modal.createdViewPConn$,
          formGroup$,
          arChildren$: modal.arChildren$,
          itemKey$: modal.key,
          isCreateStage$: true,
          updateToken$: modal.updateToken,
          isInModal$: true
        }"
      ></component-mapper>
      @if (modal.isMultiRecordData) {
        <div>
          <component-mapper
            name="ListViewActionButtons"
            [props]="{ pConn$: modal.createdViewPConn$, context$: modal.context }"
            [outputEvents]="{ closeActionsDialog: closeModalFor(modal.key) }"
          ></component-mapper>
        </div>
      }
      @if (modal.isDataObjectModal) {
        <div>
          <component-mapper
            name="DataViewActionButtons"
            [props]="{
              pConn$: modal.createdViewPConn$,
              context$: modal.context,
              classID$: modal.dataObjectClassId,
              dataObjectAction$: modal.dataObjectAction,
              dataRecordKeys$: modal.dataRecordKeys,
              actionID$: modal.dataObjectActionID
            }"
          ></component-mapper>
        </div>
      }
    </div>
  </div>
}

@if (bShowCancelAlert$) {
  <div>
    <component-mapper
      name="CancelAlert"
      [props]="{
        bShowAlert$: bShowCancelAlert$,
        pConn$: cancelPConn$,
        hideDelete: cancelHideDelete$,
        isDataObject: cancelIsDataObject$,
        skipReleaseLockRequest: cancelSkipReleaseLockRequest$
      }"
      [parent]="this"
      [outputEvents]="{ onAlertState$: onAlertState }"
    ></component-mapper>
  </div>
}

<div class="psdk-view-container-top" id="{{ buildName$ }}">
  @if (isViewContainer$) {
    <div>
      @if (title$ !== '') {
        <h3>{{ title$ }}</h3>
      }
      @if (templateName$) {
        <div>
          <component-mapper
            [name]="templateName$"
            [props]="{
              pConn$: createdViewPConn$,
              formGroup$: formGroup$,
              displayOnlyFA$: displayOnlyFA$
            }"
            errorMsg="View Container missing Template {{ templateName$ }}"
          ></component-mapper>
        </div>
      } @else {
        @for (kid of arChildren$; track kid) {
          <div>
            <component-mapper
              [name]="kid.getPConnect().getComponentName()"
              [props]="{
                pConn$: kid.getPConnect(),
                displayOnlyFA$: displayOnlyFA$
              }"
              errorMsg="ViewContainer Missing (no template): {{ kid.getPConnect().getComponentName() }}"
            ></component-mapper>
          </div>
        }
      }
    </div>
  } @else {
    <component-mapper name="reference" [props]="{ pConn$: viewPConn$, formGroup$, displayOnlyFA$ }"></component-mapper>
  }
</div>

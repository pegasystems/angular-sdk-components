@if (arMainButtons$ && arSecondaryButtons$) {
  <div class="button-bar">
    <div class="left-group">
      @for (aButton of arSecondaryButtons$; track aButton) {
        <button mat-stroked-button class="secondary-button" (click)="buttonClick(aButton.jsAction, 'secondary')">
          {{ localizedVal(aButton.name, localeCategory) }}
        </button>
      }
    </div>
    <div class="right-group">
      @for (aButton of arMainButtons$; track aButton) {
        <button mat-flat-button (click)="buttonClick(aButton.jsAction, 'primary')">
          {{ localizedVal(aButton.name, localeCategory) }}
        </button>
      }
    </div>
  </div>
}

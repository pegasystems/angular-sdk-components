@if (visibility$ !== false) {
  <div class="ng-view-top">
    @if (showLabel$ && label$ && !noHeaderTemplates.includes(templateName$)) {
      <div class="template-title-container">
        <span>{{ label$ }}</span>
      </div>
    }
    @if (templateName$) {
      <div>
        <component-mapper
          [name]="templateName$"
          [props]="{ formGroup$, pConn$, displayOnlyFA$ }"
          errorMsg="View template not recognized: [{{ templateName$ }}]"
        ></component-mapper>
      </div>
    } @else {
      @for (kid of arChildren$; track kid) {
        <div>
          <component-mapper
            [name]="kid.getPConnect().getComponentName()"
            [props]="{ pConn$: kid.getPConnect(), formGroup$ }"
            errorMsg="View Missing (displayAll): {{ kid.getPConnect().getComponentName() }}"
          ></component-mapper>
        </div>
      }
    }
  </div>
}

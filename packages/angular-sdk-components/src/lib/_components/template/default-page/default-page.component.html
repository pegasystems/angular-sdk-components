@if (enableBanner$) {
  <div>
    <component-mapper
      name="Banner"
      [props]="{
        configProps$,
        arChildren$,
        title: heading,
        message,
        backgroundImage,
        layout$
      }"
    ></component-mapper>
  </div>
} @else {
  <div>
    @if (title) {
      <h1>{{ title }}</h1>
    }
    @if (heading) {
      <p>{{ heading }}</p>
    }
    <div
      [ngClass]="{
        'psdk-grid-filter-1': this.layout$ === 'one-column',
        'psdk-grid-filter-2': this.layout$ === 'two-column',
        'psdk-grid-filter-wide-narrow': this.layout$ === 'wide-narrow',
        'psdk-grid-filter-narrow-wide': this.layout$ === 'narrow-wide'
      }"
    >
      @for (child of arChildren$; track child) {
        <component-mapper [name]="child.getPConnect().getComponentName()" [props]="{ pConn$: child.getPConnect() }"></component-mapper>
      }
    </div>
  </div>
}

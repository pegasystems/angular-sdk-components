<component-mapper
  name="FieldGroup"
  [props]="{ name: propsToUse.showLabel ? propsToUse.label : '', childrenTemplate: detailsContent }"
></component-mapper>

<ng-template #detailsContent>
  @if (showHighlightedData && highlightedDataArr.length > 0) {
    <div class="psdk-grid-highlighted">
      @for (field of highlightedDataArr; track field) {
        <component-mapper [name]="field.getComponentName()" [props]="{ pConn$: field, formGroup$ }"></component-mapper>
      }
    </div>
  }
  <div class="psdk-grid-filter-3">
    @for (child of children; track child) {
      <component-mapper [name]="child.getPConnect().getComponentName()" [props]="{ pConn$: child.getPConnect(), formGroup$ }"></component-mapper>
    }
  </div>
</ng-template>

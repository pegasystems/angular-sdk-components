<component-mapper
  name="FieldGroup"
  [props]="{ name: propsToUse.showLabel ? propsToUse.label : '', childrenTemplate: detailsContent }"
></component-mapper>

<ng-template #detailsContent>
  <component-mapper
    name="MaterialDetails"
    [props]="{
      arFields$: arFields$,
      arFields2$: arFields2$,
      arFields3$: arFields3$,
      arHighlightedFields: highlightedDataArr,
      layout: 'three-column'
    }"
  ></component-mapper>
</ng-template>

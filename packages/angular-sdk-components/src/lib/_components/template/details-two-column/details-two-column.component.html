<component-mapper
  name="FieldGroup"
  [props]="{ name: propsToUse.showLabel ? propsToUse.label : '', childrenTemplate: detailsContent }"
></component-mapper>

<ng-template #detailsContent>
  <ng-container *ngIf="showHighlightedData && highlightedDataArr.length > 0">
    <div class="psdk-grid-highlighted">
      <component-mapper
        *ngFor="let field of highlightedDataArr"
        [name]="field.getComponentName()"
        [props]="{ pConn$: field, formGroup$ }"
      ></component-mapper>
    </div>
  </ng-container>
  <div class="psdk-grid-filter-2">
    <component-mapper
      *ngFor="let child of children"
      [name]="child.getPConnect().getComponentName()"
      [props]="{ pConn$: child.getPConnect(), formGroup$ }"
    ></component-mapper>
  </div>
</ng-template>

<component-mapper
  name="FieldGroup"
  [props]="{ name: pConn$.getInheritedProps()['showLabel'] ? pConn$.getInheritedProps()['label'] : undefined, childrenTemplate: detailsContent }"
></component-mapper>

<ng-template #detailsContent>
  <component-mapper
    name="MaterialDetails"
    [props]="{ arFields$: arFields$, arHighlightedFields: highlightedDataArr, layout: 'one-column' }"
  ></component-mapper>
</ng-template>

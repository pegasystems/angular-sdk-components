@if (displayMode$ === 'DISPLAY_ONLY') {
  <div [ngClass]="label$ ? 'psdk-container-labels-left' : 'psdk-container-nolabels'">
    @if (label$) {
      <div class="psdk-grid-label">{{ label$ }}</div>
    }
    <div class="psdk-val-labels-left">
      <ng-container *ngTemplateOutlet="valueTemplate"></ng-container>
    </div>
  </div>
} @else {
  @if (displayMode$ === 'STACKED_LARGE_VAL') {
    <div class="psdk-container-stacked-large-val">
      <div class="psdk-grid-label">{{ label$ }}</div>
      <div class="psdk-val-stacked">
        <ng-container *ngTemplateOutlet="valueTemplate"></ng-container>
      </div>
    </div>
  }
}

<ng-template #valueTemplate>
  @if (isHtml$) {
    <div id="instruction-text" [innerHTML]="value$ || '---'"></div>
  } @else {
    {{ value$ || '---' }}
  }
</ng-template>

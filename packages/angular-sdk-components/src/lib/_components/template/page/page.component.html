<div class="psdk-page-title">
  <h2>{{ title$ }}</h2>
</div>
<div class="page-body">
  @for (kid of arChildren$; track kid) {
    <div>
      <div>
        @switch (kid.getPConnect().getComponentName()) {
          @case ('View') {
            <component-mapper name="View" [props]="{ pConn$: kid.getPConnect() }"></component-mapper>
          }
          @case ('reference') {
            <component-mapper name="reference" [props]="{ pConn$: kid.getPConnect() }"></component-mapper>
          }
          @case ('Region') {
            <component-mapper name="Region" [props]="{ pConn$: kid.getPConnect() }"></component-mapper>
          }
          @default {
            <div>Page Missing: {{ kid.getPConnect().getComponentName() }}</div>
          }
        }
      </div>
    </div>
  }
</div>

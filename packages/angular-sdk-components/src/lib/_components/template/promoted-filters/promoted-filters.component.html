<div>
  <div>{{ listViewProps.title }}</div>
  @if (showFilters) {
    <div class="psdk-grid-filter">
      @for (kid of processedFilters; track kid) {
        <div>
          <component-mapper
            [name]="kid.getPConnect().getComponentName()"
            [props]="{
              pConn$: kid.getPConnect(),
              formGroup$: formGroup$
            }"
            errorMsg="Promoted filters wants component not yet available: {{ kid.getPConnect().getComponentName() }}"
          ></component-mapper>
        </div>
      }
    </div>
  }

  <div>
    <button key="1" type="button" (click)="clearFilterData()" data-testid="clear" mat-raised-button color="secondary">
      {{ localizedVal('Clear', localeCategory) }}
    </button>
    <button style="float: 'right'" key="2" type="submit" (click)="getFilterData()" data-testid="search" mat-raised-button color="primary">
      {{ localizedVal('Search', localeCategory) }}
    </button>
  </div>
  @if (showTable) {
    <div>
      <component-mapper name="ListView" [props]="{ pConn$, payload }"></component-mapper>
    </div>
  }
</div>

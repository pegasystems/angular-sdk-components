@if (showSimpleTableManual) {
  <div>
    <component-mapper name="SimpleTable" [props]="{ formGroup$, pConn$ }"></component-mapper>
  </div>
}
@if (!showSimpleTableManual) {
  <div>
    @if (isSearchable) {
      <div>
        <component-mapper
          name="PromotedFilters"
          [props]="{ formGroup$, pConn$, viewName, filters, listViewProps, pageClass, parameters }"
        ></component-mapper>
      </div>
    } @else {
      <component-mapper name="ListView" [props]="{ pConn$, payload: listViewProps }"></component-mapper>
    }
  </div>
}

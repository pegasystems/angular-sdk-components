<mat-tab-group (selectedTabChange)="handleTabClick($event)">
  @for (tab of tabItems; track tab; let i = $index) {
    <mat-tab [label]="tab.name">
      @if (+currentTabId == i) {
        <div class="psdk-sub-tabs">
          @if (tab.content?.getPConnect(); as tabPConn) {
            <component-mapper
              [name]="tabPConn.getComponentName()"
              [props]="{ pConn$: tabPConn, formGroup$ }"
              errorMsg="SubTabs wants component not yet available: {{ tabPConn.getComponentName() }}"
            ></component-mapper>
          }
        </div>
      }
    </mat-tab>
  }
</mat-tab-group>

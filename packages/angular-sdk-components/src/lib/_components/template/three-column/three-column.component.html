<div class="psdk-three-column">
  @for (kid of arChildren$; track kid) {
    <div>
      @if (kid.getPConnect().getRawMetadata()['name'].toLowerCase() === 'a') {
        <div class="psdk-three-column-column">
          <component-mapper name="Region" [props]="{ pConn$: kid.getPConnect(), formGroup$ }"></component-mapper>
        </div>
      }
      @if (kid.getPConnect().getRawMetadata()['name'].toLowerCase() === 'b') {
        <div class="psdk-three-column-column">
          <component-mapper name="Region" [props]="{ pConn$: kid.getPConnect(), formGroup$ }"></component-mapper>
        </div>
      }
      @if (kid.getPConnect().getRawMetadata()['name'].toLowerCase() === 'c') {
        <div class="psdk-three-column-column">
          <component-mapper name="Region" [props]="{ pConn$: kid.getPConnect(), formGroup$ }"></component-mapper>
        </div>
      }
    </div>
  }
</div>

<div>
  @switch (this.thePConnType) {
    @case ('ViewContainer') {
      <component-mapper name="ViewContainer" [props]="{ pConn$, formGroup$ }"></component-mapper>
    }
    <!-- NOTE: when we get the view, we want to render it as a wide-narrow-form -->
    @case ('View') {
      <component-mapper name="WideNarrowForm" [props]="{ pConn$, formGroup$ }"></component-mapper>
    }
    @default {
      <div>WideNarrowPage missing: {{ this.pConn$.getComponentName() }}</div>
    }
  }
</div>

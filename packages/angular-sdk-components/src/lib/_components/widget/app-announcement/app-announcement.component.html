<article class="psdk-announcement">
  <h2>{{ configProps$.header }}</h2>
  <div>
    <p>{{ configProps$.description }}</p>
    <div>
      <ul>
        @for (detail of details$; track detail) {
          <li>{{ detail }}</li>
        }
      </ul>
    </div>
  </div>
  @if (configProps$.whatsnewlink != '') {
    <a mat-raised-button [href]="configProps$.whatsnewlink">See what's new</a>
  }
</article>

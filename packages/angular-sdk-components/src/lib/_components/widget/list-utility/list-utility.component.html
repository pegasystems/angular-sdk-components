<div style="text-align: left">
  <div class="psdk-utility">
    <div class="header">
      <div class="header-icon">
        <img class="psdk-utility-svg-icon" src="{{ headerSvgIcon$ }}" />
      </div>
      <div class="header-text">{{ name$ }}</div>
      <div class="psdk-utility-count" id="attachments-count">{{ count$ }}</div>
      <div style="flex-grow: 1"></div>
      <div class="header-icon">
        <button id="file-menu" mat-icon-button [matMenuTriggerFor]="utilityMenu">
          <img class="psdk-utility-card-actions-svg-icon" src="{{ settingsSvgIcon$ }}" />
        </button>
        <mat-menu #utilityMenu="matMenu" overlapTrigger="false">
          @for (action of arActions$; track action) {
            <button mat-menu-item (click)="action.onClick()">{{ action.text }}</button>
          }
        </mat-menu>
      </div>
    </div>
    <div class="psdk-utiltiy-divider"></div>
    <br />
    @if (bLoading$) {
      <mat-spinner class="progress-spinner" diameter="50"></mat-spinner>
    }
    @if (count$ == 0) {
      <div class="message">{{ noItemsMessage$ }}</div>
    }
    @if (count$ > 0) {
      <div class="psdk-utility-items">
        <component-mapper name="SummaryList" [props]="{ arItems$, menuIconOverrideAction$ }"></component-mapper>
      </div>
    }
    <div class="psdk-utility-view-all">
      @if (count$ > 3) {
        <button mat-button color="primary" (click)="onViewAll$.onClick()">View all</button>
      }
    </div>
  </div>
</div>

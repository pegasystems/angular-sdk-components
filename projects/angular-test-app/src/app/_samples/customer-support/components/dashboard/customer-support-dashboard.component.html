<main class="dashboard">
  <header class="dashboard-header">
    <div>
      <p class="eyebrow">Customer support</p>
      <h1>Customer Support</h1>
    </div>
    <div class="header-actions">
      <button class="settings-button" type="button" aria-label="Settings" title="Settings" (click)="openSettings()">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
          <path
            fill="currentColor"
            d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.31-.07.63-.07.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"
          />
        </svg>
      </button>
      <button class="logout-button" type="button" (click)="logOut()">Log out</button>
    </div>
  </header>

  <section class="case-types" aria-label="Available case types">
    @for (caseType of caseTypes; track caseType.pyWorkTypeImplementationClassName) {
      <button class="case-type" type="button" [disabled]="isCreatingCase" (click)="openCase(caseType)">
        <span class="case-type-name">{{ caseType.pyWorkTypeName }}</span>
        <span class="case-type-action"><span aria-hidden="true">&#8594;</span></span>
      </button>
    }
  </section>
</main>
